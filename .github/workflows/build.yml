name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3-stable
  EXPORT_NAME: Roguelike

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools & Platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot & Export Templates
        run: |
          BASE_URL="https://github.com{GODOT_VERSION}"
          wget -q "${BASE_URL}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          TEMPLATE_DIR=~/.local/share/godot/export_templates/$(echo ${GODOT_VERSION} | sed 's/-/./g')
          mkdir -p "$TEMPLATE_DIR"
          wget -q "${BASE_URL}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}_export_templates.tpz" -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATE_DIR/"

      - name: Setup Keystore & Editor Settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${{ github.workspace }}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Project & Export APK
        run: |
          mkdir -p build
          godot --headless --import
          godot --headless --export-debug "Android" "build/${EXPORT_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${EXPORT_NAME}-APK
          path: build/${EXPORT_NAME}.apk
